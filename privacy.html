<h1>개인정보처리방침</h1>
<p>rclone obsidian은 소유자 한 사람이 자기 PC에서만 쓰는 도구입니다.</p>
<ul>
<li>Google Drive 권한은 <code>drive.file</code> 하나만 요청하며, 이 도구가 직접 만든 파일에만 접근합니다.</li>
<li>사용자의 Google 계정 정보나 파일 내용을 수집·저장·공유하지 않습니다. 인증 정보는 사용자 PC에만 저장됩니다.</li>
<li>어떤 데이터도 제3자나 외부 서버로 보내지 않습니다.</li>
</ul>
